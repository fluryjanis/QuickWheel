<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Action Wheel Side Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    h1 { font-size: 18px; font-weight: 700; color: #38bdf8; }
    .meta { font-size: 12px; color: #64748b; margin-top: 4px; word-break: break-all; }
    .content-box {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.5;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 16px;
    }
    .actions { display: flex; gap: 8px; }
    button {
      flex: 1;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
  </style>
</head>
<body>
  <header>
    <h1>Action Wheel Workspace</h1>
    <div class="meta" id="page-info">No context loaded</div>
  </header>

  <div class="content-box" id="content-display">Select text and gesture UP on the Action Wheel to send content here.</div>

  <div class="actions">
    <button id="btn-copy">Copy Text</button>
    <button id="btn-clear" class="secondary">Clear</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
